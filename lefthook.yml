pre-commit:
  parallel: true
  commands:
    biome:
      root: "cyneform_gigs/"
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx @biomejs/biome check --write --no-errors-on-unmatched {staged_files}
      stage_fixed: true
    typecheck:
      root: "cyneform_gigs/"
      glob: "*.{ts,tsx}"
      run: sh -c 'dirs=$(echo "{staged_files}" | tr " " "\n" | sed "s#^\./##" | xargs -n1 dirname 2>/dev/null | grep -oE "^apps/(web|api)|^packages/(db|types|validators)" | sort -u); if [ -z "$dirs" ]; then echo "No workspace files changed"; exit 0; fi; for d in $dirs; do (cd "$d" && bun run typecheck) || exit 1; done'
