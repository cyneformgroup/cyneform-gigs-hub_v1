pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,md,yml,yaml,css}"
      run: bunx prettier --check {staged_files}
    - name: lint
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: bun run typecheck
    - name: lint
      run: bun run lint