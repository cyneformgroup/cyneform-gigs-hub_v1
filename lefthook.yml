pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{ts,tsx,js,json,css}"
      run: bun --cwd cyneform_gigs node_modules/.bin/biome format --staged
    - name: lint
      glob: "*.{ts,tsx}"
      run: bunx oxlint {staged_files}

pre-push:
  jobs:
    - name: typecheck
      run: bun --cwd cyneform_gigs typecheck
    - name: lint
      run: bunx oxlint cyneform_gigs
